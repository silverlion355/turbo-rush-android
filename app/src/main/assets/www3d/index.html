<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>极速狂飙 3D · Turbo Rush 3D</title>

<!-- ============================================================
     启动引导（必须最先执行，不依赖 three.min.js / main.js）
       1. 立即锁定横屏 —— WebView 注入桥可能晚于页面脚本，故多重重试
       2. 全局错误捕获 → 屏幕底部诊断条（真机排查的唯一可见通道）
       3. 诊断信息：THREE 版本 / WebGL / 视口 / 帧率
     ============================================================ -->
<script>
window.__diag = { msgs: [], three: '未加载', webgl: '检测中', size: '-', fps: 0, objs: 0 };
window.__booted = false;

window.__diagText = function () {
  var d = window.__diag;
  var s = 'THREE:' + d.three + ' | WebGL:' + d.webgl + ' | ' + d.size + ' | ' + d.fps + 'fps | obj:' + d.objs;
  if (d.extra) s += '\n' + d.extra;
  if (d.msgs.length) s += '\n' + d.msgs.slice(-3).join('\n');
  return s;
};
window.__diagRefresh = function () {
  try { var el = document.getElementById('diag'); if (el) el.textContent = window.__diagText(); } catch (e) {}
};
/* 诊断条默认隐藏：仅当出现 [FATAL]/[ERR]/[REJ] 级错误时才弹出（正常游戏界面无黑条） */
window.__diagLog = function (m) {
  try {
    var s = String(m);
    if (window.__diag.msgs.indexOf(s) < 0) window.__diag.msgs.push(s);
    if (/^\[(FATAL|ERR|REJ)\]/.test(s)) {
      var el = document.getElementById('diag');
      if (el) { el.style.display = 'block'; el.textContent = window.__diagText(); }
      var fb = document.getElementById('fatalBox');
      if (fb) { fb.style.display = 'block'; fb.textContent = s; }
    }
  } catch (e) {}
};

/* —— 横屏锁定：立即 + 轮询重试 + pageshow —— */
function __lockLandscape() {
  try {
    if (window.AndroidBridge && AndroidBridge.setOrientation) AndroidBridge.setOrientation('landscape');
  } catch (e) {}
}
__lockLandscape();
var __ln = 0;
var __li = setInterval(function () { __lockLandscape(); if (++__ln >= 16) clearInterval(__li); }, 250);
window.addEventListener('pageshow', __lockLandscape);

/* —— 全局错误捕获（放在所有脚本之前，确保能抓到启动期异常）—— */
window.onerror = function (msg, src, line) {
  window.__diagLog('[ERR] ' + msg + ' @' + String(src || '').split('/').pop() + ':' + line);
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  window.__diagLog('[REJ] ' + ((e.reason && e.reason.message) || e.reason));
});
</script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0f1a; touch-action:none;
              font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  /* ⚠️ 必须显式声明 100%：否则高 DPR 手机上 canvas 会按固有(物理)像素撑开，只显示画面一角 */
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* —— HUD —— */
  #hud { position:fixed; inset:0; pointer-events:none; color:#fff; z-index:3; }
  .top { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
         align-items:flex-start; padding:10px 12px;
         padding-left:calc(12px + env(safe-area-inset-left)); padding-right:calc(12px + env(safe-area-inset-right)); }
  .score-box { background:rgba(8,12,24,.55); border:1px solid rgba(255,255,255,.14); border-radius:14px;
               padding:5px 12px; backdrop-filter:blur(6px); text-align:center; }
  .score-box .label { font-size:10px; letter-spacing:2px; opacity:.65; }
  .score-box .value { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
  #score { color:#ffd23f; }
  /* 功能按钮：统一由 #topBtns 弹性容器排布（竖屏竖排 / 横屏横排，间隔 8px，永不重叠）
     —— 旧版三个按钮各自 absolute 定位，横屏下 btnSound/btnGyro 都写 right:12px;top:56px
        直接完全重叠，btnView 也与 btnGyro 横向压叠 46px。 */
  #topBtns { position:absolute; top:60px; right:calc(12px + env(safe-area-inset-right));
             display:flex; flex-direction:column; align-items:flex-end; gap:8px; pointer-events:none; }
  #btnSound, #btnView, #btnGyro { position:relative; pointer-events:auto; height:34px; border-radius:11px;
        font-size:12px; font-weight:700; letter-spacing:1px; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  #btnSound { background:rgba(8,12,24,.5); border:1px solid rgba(255,255,255,.15);
              color:#fff; width:34px; font-size:16px; }
  #btnView { background:rgba(8,12,24,.6); border:1px solid rgba(255,255,255,.18);
             color:#cfe6ff; padding:0 12px; }
  #btnView.hidden { display:none; }
  #btnGyro { background:rgba(8,12,24,.6); border:1px solid rgba(127,240,192,.35);
             color:#7ff0c0; padding:0 12px; }
  #viewBadge { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:rgba(8,12,24,.5);
               border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:3px 13px; font-size:11px;
               letter-spacing:2px; color:#9fd0ff; }
  /* —— 连击条 —— */
  #combo { position:absolute; left:50%; top:48px; transform:translateX(-50%); text-align:center; pointer-events:none;
           opacity:0; transition:opacity .2s; }
  #combo .cm { font-size:19px; font-weight:900; color:#ffd23f; text-shadow:0 0 14px rgba(255,200,60,.8); letter-spacing:1px; }
  #combo .bar { width:140px; height:4px; border-radius:2px; background:rgba(255,255,255,.16); margin:4px auto 0; overflow:hidden; }
  #combo .bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffd23f,#ff7a2e); }
  /* —— 生命值 —— */
  #lives { position:absolute; right:12px; bottom:34px; display:flex; gap:6px;
           filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); right:calc(12px + env(safe-area-inset-right)); }
  .heart { width:18px; height:18px; transform:rotate(45deg); border-radius:4px; background:linear-gradient(135deg,#ff5a6e,#ff2d55);
           box-shadow:0 0 8px rgba(255,45,85,.6); }
  .heart.off { background:#263040; box-shadow:none; }
  /* —— 飘分 —— */
  .pop { position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:17px; color:#ffe25a;
         text-shadow:0 1px 6px rgba(0,0,0,.7); pointer-events:none; z-index:6; animation:popRise .9s ease-out forwards; }
  .pop.x2 { color:#ff9d2e; font-size:20px; }
  .pop.x15 { color:#7fe8ff; font-size:19px; }
  @keyframes popRise { 0%{opacity:0; transform:translate(-50%,-30%) scale(.7);} 12%{opacity:1; transform:translate(-50%,-60%) scale(1.08);}
                       100%{opacity:0; transform:translate(-50%,-260%) scale(1);} }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:5; opacity:0;
           background:radial-gradient(ellipse at center, transparent 40%, rgba(255,40,60,.55) 100%); }
  /* —— 叠加层 —— */
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:14px; background:rgba(6,9,18,.30); z-index:10; text-align:center; padding:18px; }
  .overlay.hidden { display:none; }
  .logo-3d { font-size:38px; font-weight:900; letter-spacing:2px; line-height:1.1;
             background:linear-gradient(180deg,#fff 20%,#ffd23f 70%,#ff9d2e); -webkit-background-clip:text;
             background-clip:text; color:transparent; }
  .sub { font-size:11px; color:#9fb0c8; letter-spacing:4px; }
  .badge { font-size:11px; color:#7ff0c0; border:1px solid rgba(127,240,192,.4); padding:3px 10px; border-radius:999px;
           background:rgba(127,240,192,.08); letter-spacing:1px; }
  .btn { pointer-events:auto; cursor:pointer; border:none; border-radius:16px; padding:12px 40px; font-size:17px; font-weight:800;
         letter-spacing:3px; color:#1a1204; background:linear-gradient(180deg,#ffd23f,#ff9d2e); box-shadow:0 6px 24px rgba(255,160,40,.35);
         transition:transform .08s; }
  .btn:active { transform:scale(.96); }
  .btn.ghost { background:rgba(255,255,255,.06); color:#cfe0f5; border:1px solid rgba(255,255,255,.18); box-shadow:none; }
  .tips { font-size:11px; color:#93a1b8; line-height:1.8;
          background:rgba(6,10,18,.62); border:1px solid rgba(255,255,255,.09); border-radius:12px;
          padding:9px 16px; backdrop-filter:blur(5px); max-width:560px; }
  .tips b { color:#cfe0f5; }

  /* —— 非比赛状态（开始菜单 / 结算）隐藏比赛 HUD，避免和标题/说明叠在一起 —— */
  #hud:not(.playing) .top,
  #hud:not(.playing) #gauge,
  #hud:not(.playing) #pedals,
  #hud:not(.playing) #mapBox,
  #hud:not(.playing) #combo,
  #hud:not(.playing) #lives,
  #hud:not(.playing) #viewBadge { display:none; }
  #overTitle { font-size:25px; font-weight:900; color:#ff5a6e; letter-spacing:2px; }
  #overStats { font-size:13px; color:#cbd6e6; line-height:2.1; }
  #overStats b { color:#ffd23f; font-size:17px; }
  .no-webgl { color:#ff8a8a; font-size:13px; max-width:300px; line-height:1.8; }
  .ver { position:absolute; bottom:30px; font-size:10px; color:#55627a; letter-spacing:1px; }

  /* —— 诊断条（默认隐藏：只在 [FATAL]/[ERR] 崩溃时自动弹出，正常游戏不显示）—— */
  #diag { position:fixed; left:0; right:0; bottom:0; z-index:99999; display:none;
          background:rgba(0,0,0,.78); color:#7ff0c0; font:10px/1.45 monospace;
          padding:3px 8px calc(3px + env(safe-area-inset-bottom)); white-space:pre-wrap;
          word-break:break-all; pointer-events:none; }

  /* —— 左下：速度仪表盘 —— */
  #gauge { position:absolute; left:calc(8px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom));
           width:112px; height:112px; pointer-events:none; filter:drop-shadow(0 4px 12px rgba(0,0,0,.45)); }
  /* —— 左下：油门 / 刹车踏板 —— */
  #pedals { position:absolute; left:calc(126px + env(safe-area-inset-left));
            bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:12px; align-items:flex-end;
            pointer-events:none; }
  .pedal { pointer-events:auto; width:74px; height:74px; border-radius:50%; display:flex; align-items:center;
           justify-content:center; font-size:14px; font-weight:800; letter-spacing:1px; user-select:none;
           border:2px solid rgba(255,255,255,.25); backdrop-filter:blur(4px); transition:transform .06s, box-shadow .1s; }
  .pedal.gas { background:radial-gradient(circle at 35% 30%, rgba(120,255,190,.35), rgba(20,120,80,.55));
               color:#d8fff0; box-shadow:0 6px 18px rgba(30,200,130,.28); }
  .pedal.brake { background:radial-gradient(circle at 35% 30%, rgba(255,150,160,.35), rgba(140,25,45,.55));
                 color:#ffe0e4; box-shadow:0 6px 18px rgba(220,50,80,.28); }
  .pedal.on { transform:scale(.92); box-shadow:0 0 22px rgba(255,255,255,.35); }
  /* —— 右下：路线图 + 里程 —— */
  #mapBox { position:absolute; right:calc(8px + env(safe-area-inset-right)); bottom:calc(8px + env(safe-area-inset-bottom));
            width:118px; pointer-events:none; text-align:center; }
  #mini { width:118px; height:118px; display:block; border-radius:14px;
          background:rgba(8,12,22,.5); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(4px); }
  #mile { margin-top:3px; font-size:12px; font-weight:800; color:#7fd7ff; font-variant-numeric:tabular-nums;
          text-shadow:0 1px 4px rgba(0,0,0,.6); }

  /* —— 横屏适配：屏幕高度小，压缩纵向、按钮横排 —— */
  @media (orientation: landscape) and (max-height: 560px) {
    .overlay { gap:8px; padding:10px 16px; }
    .logo-3d { font-size:27px; }
    .sub { font-size:10px; letter-spacing:3px; }
    .badge { font-size:10px; padding:2px 8px; }
    .btn { padding:9px 32px; font-size:15px; }
    .tips { font-size:10px; line-height:1.6; }
    .ver { bottom:22px; font-size:9px; }
    #topBtns { top:56px; flex-direction:row; align-items:center; }
    #btnSound, #btnView, #btnGyro { height:30px; font-size:11px; border-radius:9px; }
    #btnSound { width:30px; font-size:14px; }
    #lives { bottom:28px; }
    #gauge { width:96px; height:96px; bottom:6px; }
    #pedals { left:calc(110px + env(safe-area-inset-left)); bottom:6px; gap:10px; }
    .pedal { width:62px; height:62px; font-size:12px; }
    #mapBox { width:100px; bottom:6px; }
    #mini { width:100px; height:100px; }
    #mile { font-size:11px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="top">
    <div class="score-box"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">宝石</div><div class="value" id="gemVal">0</div></div>
  </div>
  <div id="viewBadge">追尾视角</div>
  <div id="topBtns">
    <button id="btnSound">&#9835;</button>
    <button id="btnView" class="hidden">切换视角</button>
    <button id="btnGyro">陀螺仪·关</button>
  </div>
  <div id="combo"><div class="cm" id="comboTxt">x1</div><div class="bar"><i id="comboBar"></i></div></div>
  <canvas id="gauge" width="224" height="224"></canvas>
  <div id="pedals">
    <div class="pedal brake" id="pedBrake">刹车</div>
    <div class="pedal gas" id="pedGas">油门</div>
  </div>
  <div id="mapBox">
    <canvas id="mini" width="236" height="236"></canvas>
    <div id="mile">0 m</div>
  </div>
  <div id="lives"></div>
</div>
<div id="flash"></div>

<!-- 开始菜单 -->
<div class="overlay" id="menu">
  <div class="logo-3d">极速狂飙<span style="font-size:20px"> 3D</span></div>
  <div class="sub">TURBO RUSH 3D</div>
  <div class="badge">横屏 · 弯道赛道 · 双视角</div>
  <button class="btn" id="btnStart">开 始</button>
  <div class="tips">
    <span>&#128664; 左下 <b>油门 / 刹车踏板</b> · 屏幕右侧左右滑动控制转向</span><br>
    <span>&#128506; 右下 <b>路线图</b> 实时显示位置与里程</span><br>
    <span>&#128268; 点右上 <b>陀螺仪</b> 可用机身倾斜调整视角 · <b>C</b> 切换车内/车后视角</span><br>
    <span>&#9000; 键盘：←→/A D 转向 · ↑油门 · ↓刹车</span><br>
    <span>&#128142; 连吃宝石触发 <b>连击倍率</b> · 躲避车辆 · 撞车损失生命</span>
  </div>
  <div class="ver">v0.13.1</div>
</div>

<!-- 结束 -->
<div class="overlay hidden" id="over">
  <div id="overTitle">车辆损毁</div>
  <div id="overStats">
    得分 <b id="finalScore">0</b><br>
    里程 <b id="finalDist">0</b> m · 宝石 <b id="finalGems">0</b>
  </div>
  <button class="btn" id="btnAgain">再 来 一 局</button>
</div>

<!-- 诊断条 -->
<div id="diag"></div>

<script src="js/three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    window.__diagLog('three.min.js 加载失败：THREE 未定义');
  } else {
    window.__diag.three = 'r' + THREE.REVISION;
    window.__diagRefresh();
  }
</script>
<script src="js/main.js"></script>
<script src="js/fallback.js"></script>
<script>
  /* main.js 的 boot() 在 DOMContentLoaded 时才执行，故延后检查启动结果 */
  function __checkBoot() {
    if (!window.__booted) window.__diagLog('main.js 未完成启动（见上方错误）');
    if (window.__diagRefresh) window.__diagRefresh();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(__checkBoot, 60); });
  } else {
    setTimeout(__checkBoot, 60);
  }
</script>
</body>
</html>
