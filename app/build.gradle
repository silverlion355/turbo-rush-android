plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silverlion.turborush'
    compileSdk 34

    defaultConfig {
        applicationId "com.silverlion.turborush"
        minSdk 24            // Android 7.0+，覆盖主流设备
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零第三方依赖：游戏为本地 WebView + Canvas，全部逻辑在 assets 内
}
