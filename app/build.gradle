plugins {
    id 'com.android.application'
}

// —— 签名配置：CI 通过环境变量注入 keystore；本地无密钥时可正常构建 debug ——
// 注意：局部变量名避免与 signingConfigs 的 DSL setter(keyAlias 等)同名，否则 Groovy 会把 setter 调用解析为变量调用
def ksB64 = System.getenv('KEYSTORE_B64')
def ksStorePass = System.getenv('KEYSTORE_PASSWORD')
def ksKeyPass = System.getenv('KEY_PASSWORD') ?: ksStorePass
def ksAlias = System.getenv('KEY_ALIAS') ?: 'turborush'
def hasSigning = ksB64 != null && ksStorePass != null

// versionCode/versionName 支持 CI 通过 -P 参数覆盖(用于无缝升级)
def vCode = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : 1
def vName = project.hasProperty('versionName') ? project.property('versionName').toString() : '0.1.0'

android {
    namespace 'com.silverlion.turborush'
    compileSdk 34

    defaultConfig {
        applicationId "com.silverlion.turborush"
        minSdk 24            // Android 7.0+，覆盖主流设备
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            if (hasSigning) {
                // CI 用：从 base64 还原 keystore 到临时文件
                def tmpKs = new File(project.buildDir, 'release-keystore.p12')
                tmpKs.parentFile.mkdirs()
                tmpKs.bytes = Base64.decoder.decode(ksB64)
                storeFile tmpKs
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 保持与 release 相同签名链：使用同一 keystore(CI 已注入)，
            // 这样 debug/release 产物都能被后续 release 覆盖安装
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 零第三方依赖：游戏为本地 WebView + Canvas，全部逻辑在 assets 内
}
